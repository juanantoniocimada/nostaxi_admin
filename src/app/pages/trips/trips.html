<app-header></app-header>



<div>
  <button style="margin-top: 10%;" class="btn-outline" (click)="goToHome()">
    solicitar viaje
  </button>
  <mat-card class="material-proof-card" style="margin-top: 8em;">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z2">

      <!-- ID -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let trip">
          {{ trip.id }}
        </td>
      </ng-container>

      <!-- Driver -->
      <ng-container matColumnDef="driverName">
        <th mat-header-cell *matHeaderCellDef>Driver</th>
        <td mat-cell *matCellDef="let trip">
          {{ trip.driverName }}
        </td>
      </ng-container>

      <!-- Plate -->
      <ng-container matColumnDef="plate">
        <th mat-header-cell *matHeaderCellDef>Plate</th>
        <td mat-cell *matCellDef="let trip">
          {{ trip.plate }}
        </td>
      </ng-container>

      <!-- Pickup Time -->
      <ng-container matColumnDef="pickupTime">
        <th mat-header-cell *matHeaderCellDef>Pickup</th>
        <td mat-cell *matCellDef="let trip">
          {{ trip.pickupTime }}
        </td>
      </ng-container>

      <!-- Confirmed -->
      <ng-container matColumnDef="confirmed">
        <th mat-header-cell *matHeaderCellDef>Confirmed</th>
        <td mat-cell *matCellDef="let trip">
          {{ trip.confirmed ? 'Yes' : 'No' }}
        </td>
      </ng-container>

      <!-- Header -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

      <!-- Rows -->
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>
  </mat-card>
</div>
