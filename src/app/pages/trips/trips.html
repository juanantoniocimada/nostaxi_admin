<app-header></app-header>

<div class="content">

  <div class="actions">

    <button mat-raised-button color="primary" (click)="goToHome()">
      Solicitar viaje
    </button>

  </div>

  <mat-card class="material-proof-card">

    <mat-card-header>
      <mat-card-title>Mis viajes</mat-card-title>
    </mat-card-header>

    <mat-card-content>

      <div class="pickup-input">
        <label for="pickupTime">filtrar:</label>
        <br />
        <input class="input-field" type="datetime-local" name="pickupTime" id="pickupTime" [(ngModel)]="pickupTime" />
        <button class="btn-outline">borrar filtro</button>
      </div>

      <table mat-table [dataSource]="dataSource">

        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>ID</th>
          <td mat-cell *matCellDef="let trip">
            {{ trip.id }}
          </td>
        </ng-container>

        <ng-container matColumnDef="driverName">
          <th mat-header-cell *matHeaderCellDef>Driver</th>
          <td mat-cell *matCellDef="let trip">
            {{ trip.driverName }}
          </td>
        </ng-container>

        <ng-container matColumnDef="plate">
          <th mat-header-cell *matHeaderCellDef>Plate</th>
          <td mat-cell *matCellDef="let trip">
            {{ trip.plate }}
          </td>
        </ng-container>

        <ng-container matColumnDef="pickupTime">
          <th mat-header-cell *matHeaderCellDef>Pickup</th>
          <td mat-cell *matCellDef="let trip">
            {{ trip.pickupTime }}
          </td>
        </ng-container>

        <ng-container matColumnDef="confirmed">
          <th mat-header-cell *matHeaderCellDef>Confirmed</th>
          <td mat-cell *matCellDef="let trip">
            {{ trip.confirmed ? 'Yes' : 'No' }}
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Acciones</th>

          <td mat-cell *matCellDef="let trip">

            <button mat-raised-button color="primary" (click)="goToHome()">
              cancel
            </button>


            <button mat-raised-button color="primary" (click)="goToHome()">
              ver en mapa
            </button>

          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      </table>

    </mat-card-content>

  </mat-card>

</div>
